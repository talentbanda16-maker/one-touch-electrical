server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API — same-origin from the browser's point of view, same as
    # the Vite dev proxy, so the frontend needs no build-time API base URL.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routes (react-router) all resolve to
    # index.html; only real static assets 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
